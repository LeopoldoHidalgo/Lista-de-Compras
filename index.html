<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Compras - Stock</title>
  
  <style>
    /* Mantenemos tu diseño original pero con los nuevos colores */
    :root {
      --color-fondo: #2c3e50;    /* Azul Oscuro del Verificador */
      --color-primario: #34495e; 
      --color-acento: #2ecc71;   
      --color-boton: #2980b9;    /* Azul del botón del Verificador */
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--color-fondo);
      margin: 0;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: white; /* Blanco para que resalte sobre el azul */
      margin-bottom: 20px;
    }

    /* Tu tabla original */
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    th {
      background-color: #f2f2f2;
      color: var(--color-primario);
      padding: 12px;
      border-bottom: 2px solid #ddd;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    /* El resaltado de faltantes que te gustaba */
    .faltante {
      background-color: #ffeaa7; 
      font-weight: bold;
    }

    .controles {
      text-align: center;
      margin-bottom: 20px;
    }

    .btn-accion {
      padding: 12px 25px;
      font-size: 16px;
      background-color: var(--color-boton);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin: 5px;
    }

    /* Icono de engranaje discreto */
    .settings-icon {
      position: fixed;
      top: 10px;
      right: 10px;
      opacity: 0.3;
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button class="settings-icon" onclick="configurarURL()">⚙️</button>

  <h1>Lista de Compras</h1>

  <div class="controles">
    <button class="btn-accion" onclick="procesarInventario()">🔄 Actualizar Stock</button>
    <button class="btn-accion" onclick="window.print()" style="background-color: var(--color-primario);">🖨️ Imprimir</button>
  </div>

  <table id="tablaProductos">
    <thead>
      <tr>
        <th>Producto</th>
        <th>Presentación</th>
        <th>Stock Actual</th>
        <th>Mínimo</th>
      </tr>
    </thead>
    <tbody id="cuerpoTabla">
      </tbody>
  </table>

  <script>
    // PRODUCTOS DE PRUEBA
    const productosPrueba = [
      { nombre: "Leche Entera", pres: "1 Litro", stock: 2, min: 5 },
      { nombre: "Huevo Blanco", pres: "1 Kg", stock: 1, min: 3 },
      { nombre: "Aceite", pres: "900 ml", stock: 4, min: 2 } // Este no saldría si solo filtramos faltantes
    ];

    function configurarURL() {
      const url = prompt("Enlace CSV de Google Sheets:", localStorage.getItem('csv_master_url') || "");
      if (url !== null) {
        localStorage.setItem('csv_master_url', url);
        location.reload();
      }
    }

    async function procesarInventario() {
      const urlCSV = localStorage.getItem('csv_master_url');
      const cuerpo = document.getElementById("cuerpoTabla");
      cuerpo.innerHTML = "";

      if (!urlCSV) {
        renderizar(productosPrueba.filter(p => p.stock <= p.min));
        return;
      }

      try {
        const respuesta = await fetch(urlCSV);
        const datos = await respuesta.text();
        const filas = datos.split(/\r?\n/).filter(f => f.trim() !== "").slice(1);
        let faltantes = [];

        filas.forEach(linea => {
          const c = linea.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          if (c.length >= 7) {
            const stockActual = parseInt(c[5]) || 0;
            const stockMinimo = parseInt(c[6]) || 0;

            if (stockActual <= stockMinimo) {
              faltantes.push({
                nombre: c[1].replace(/"/g, '').trim(),
                pres: c[2].replace(/"/g, '').trim(),
                stock: stockActual,
                min: stockMinimo
              });
            }
          }
        });
        renderizar(faltantes);
      } catch (e) {
        renderizar(productosPrueba.filter(p => p.stock <= p.min));
      }
    }

    function renderizar(lista) {
      const cuerpo = document.getElementById("cuerpoTabla");
      if (lista.length === 0) {
        cuerpo.innerHTML = "<tr><td colspan='4' style='text-align:center;'>✅ Todo en orden</td></tr>";
        return;
      }
      lista.forEach(p => {
        const tr = document.createElement("tr");
        tr.className = "faltante";
        tr.innerHTML = `<td>${p.nombre}</td><td>${p.pres}</td><td>${p.stock}</td><td>${p.min}</td>`;
        cuerpo.appendChild(tr);
      });
    }

    document.addEventListener('DOMContentLoaded', procesarInventario);
  </script>
</body>
</html>
